[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-monitor-linux"
version = "0.1.0"
description = "A live, themed AMD GPU monitor for Linux desktops"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8"]

[project.scripts]
gpu-monitor = "gpu_monitor:main"

[tool.setuptools]
py-modules = ["gpu_monitor"]
